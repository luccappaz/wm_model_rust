[package]
name = "wm_fuzzy"
version = "0.1.0"
edition = "2024"
authors = ["Lucca da Paz <luccagpaz@gmail.com>"]
description = "Wang-Mendel fuzzy rule-based modeling and inference system in Rust."
license = "MIT"
repository = "https://github.com/luccappaz/wm_fuzzy"
readme = "README.md"
keywords = ["fuzzy-logic", "machine-learning", "wang-mendel", "ai", "inference"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
